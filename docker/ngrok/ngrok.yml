version: "2"
tunnels:
  # ngrok free plan hanya mengalokasikan SATU ephemeral domain per agent session —
  # dua tunnel http tanpa `domain:` eksplisit di plan gratis akan collide ke satu
  # URL yang sama (dibuktikan lewat log: kedua tunnel dapat public_url identik,
  # dan yang benar-benar reachable cuma salah satu).
  #
  # Default: tunnel `backend` (webhook Midtrans, use-case utama). Untuk akses
  # aplikasi dari HP, tukar jadi blok `frontend` di bawah DAN ganti `command:`
  # service `ngrok` di docker-compose.yml jadi `start frontend` — dua tempat itu
  # harus cocok, kalau tidak container langsung exit. Langkah lengkap: README
  # §Tunneling (ngrok).
  #
  # Punya paid plan dengan reserved domain? Aktifkan kedua blok, isi `domain:`
  # masing-masing, lalu ganti `command:` jadi `start --all`.
  backend:
    proto: http
    addr: backend:8080
  # frontend:
  #   proto: http
  #   addr: frontend:8000
  #   domain: your-reserved-domain.ngrok-free.app
